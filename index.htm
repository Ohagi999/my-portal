
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f8fc">
  <title>My Portal</title>
  <style>
    :root {
      --blue: #2459a9;
      --blue-light: #edf4ff;
      --text: #1d2939;
      --muted: #667085;
      --border: #e0e7f0;
      --bg: #f5f8fc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans JP", sans-serif;
      line-height: 1.7;
    }

    header {
      background: white;
      border-bottom: 1px solid var(--border);
    }

    .header-inner, main, footer {
      width: min(100% - 40px, 1000px);
      margin: 0 auto;
    }

    .header-inner {
      min-height: 78px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--blue);
      color: white;
      font-size: 22px;
      font-weight: 800;
    }

    .brand {
      font-size: 20px;
      font-weight: 750;
      letter-spacing: .02em;
    }

    main { padding-top: 54px; padding-bottom: 64px; }

    .eyebrow {
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .14em;
    }

    h1 {
      margin: 8px 0 12px;
      font-size: clamp(30px, 5vw, 42px);
      letter-spacing: -.04em;
      line-height: 1.3;
    }

    .intro {
      max-width: 600px;
      margin: 0;
      color: var(--muted);
    }

    .section-title {
      margin: 42px 0 16px;
      font-size: 18px;
    }

    .apps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .app-card {
      display: flex;
      flex-direction: column;
      min-height: 235px;
      padding: 24px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      text-decoration: none;
      color: inherit;
      transition: transform .18s ease, border-color .18s ease,
        box-shadow .18s ease;
    }

    .app-card:hover {
      transform: translateY(-3px);
      border-color: #9db8e8;
      box-shadow: 0 10px 28px rgba(35, 72, 130, .08);
    }

    .app-card:focus-visible {
      outline: 3px solid #8bb4ff;
      outline-offset: 3px;
    }

    .app-icon {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 15px;
      background: var(--blue-light);
      color: var(--blue);
      font-size: 26px;
    }

    .app-card h3 {
      margin: 18px 0 5px;
      font-size: 21px;
    }

    .app-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .open-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 24px;
      color: var(--blue);
      font-size: 14px;
      font-weight: 750;
    }

    .arrow { font-size: 20px; }

    .note {
      margin-top: 28px;
      padding: 18px 20px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
    }

    footer {
      padding-top: 20px;
      padding-bottom: 28px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 520px) {
      .header-inner, main, footer {
        width: min(100% - 28px, 1000px);
      }
      main { padding-top: 38px; }
      .app-card { min-height: 215px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo" aria-hidden="true">M</div>
      <div class="brand">My Portal</div>
    </div>
  </header>

  <main>
    <div class="eyebrow">MY PERSONAL SPACE</div>
    <h1>自分のサイトを、<br>ここから。</h1>
    <p class="intro">
      作ったWebサイトやアプリをまとめた、自分専用のポータル。
      使いたいサービスを選んで開けます。
    </p>

    <h2 class="section-title">マイアプリ</h2>
    <section class="apps" id="apps" aria-label="マイアプリ一覧"></section>

    <div class="note">
      新しいサイトを作ったら、このページに追加していきましょう。
      ここを自分専用のWebサイトの入口として育てていけます。
    </div>
  </main>

  <footer>My Portal · Personal Website Collection</footer>

  <script>
    // 新しいサイトを追加するときは、この一覧に1件追加してください。
    const apps = [
      {
        name: "Travel Plan",
        description: "旅行の日程や行きたい場所を計画する。",
        url: "https://travel-plan2.vercel.app/",
        icon: "🗓️"
      },
      {
        name: "Travel Log",
        description: "旅行の思い出、写真、訪問先を記録する。",
        url: "https://travel-log-zeta-seven.vercel.app/",
        icon: "🗺️"
      }
    ];

    const container = document.getElementById("apps");

    apps.forEach(app => {
      const card = document.createElement("a");
      card.className = "app-card";
      card.href = app.url;
      card.target = "_blank";
      card.rel = "noopener noreferrer";
      card.setAttribute("aria-label", app.name + "を新しいタブで開く");

      const icon = document.createElement("div");
      icon.className = "app-icon";
      icon.setAttribute("aria-hidden", "true");
      icon.textContent = app.icon;

      const title = document.createElement("h3");
      title.textContent = app.name;

      const description = document.createElement("p");
      description.textContent = app.description;

      const link = document.createElement("div");
      link.className = "open-link";

      const label = document.createElement("span");
      label.textContent = "サイトを開く";

      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.setAttribute("aria-hidden", "true");
      arrow.textContent = "↗";

      link.append(label, arrow);
      card.append(icon, title, description, link);
      container.appendChild(card);
    });
  </script>
</body>
</html>
